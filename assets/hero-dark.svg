  <defs><linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7294FF"/><stop offset=".65" stop-color="#3C66FF"/><stop offset="1" stop-color="#2950DB"/></linearGradient></defs>
  <style>
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 6s ease-in-out infinite; }
    .sprout { transform-origin: 0 4px; animation: sway 5s ease-in-out infinite; }
    .fly { animation: hover 7s ease-in-out infinite; }
    @keyframes blink { 0%, 43%, 48%, 100% { transform: scaleY(1); } 45%, 46% { transform: scaleY(.12); } }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .blink, .sprout, .fly { animation: none; } }
  </style>
